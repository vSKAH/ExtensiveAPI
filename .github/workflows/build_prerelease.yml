# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java Build And Github Deploy Release

on:
  pull_request:
    branches: [ "preprod" ]

jobs:
  build:

    name: Maven build preprod
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3.11.0
      with:
        distribution: 'adopt'
        java-version: '17'
        java-package: jdk
        architecture: x64

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn package --file pom.xml
    
    - name: Copy
      run: |
        mkdir extensiveapi-all-compiled
        cp """extensiveapi-minecraft/target/extensiveapi-minecraft v3.0-beta.4.jar""" extensiveapi-all-compiled
        cp """extensiveapi-databases/target/extensiveapi-databases v3.0-beta.4.jar""" extensiveapi-all-compiled
        cp """extensiveapi-core/target/extensiveapi-core v3.0-beta.4.jar""" extensiveapi-all-compiled

    - name: Get the latest commit sha
      id: latest
      run: | 
        echo "::set-output name=sha_short::$(git rev-parse --short preprod)"

    - name: Create Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_name: vSKAH/ExtensiveAPI
        # A personal access token for the GitHub repository in which the release will be created and edited.
        # It is recommended to create the access token with the following scopes: `repo, user, admin:repo_hook`.
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file_glob: true
        file: extensiveapi-all-compiled/*
        overwrite: true
        tag: RC-${{ steps.latest.outputs.sha_short }}
        prerelease: true
        body: "
        ## 💾  Download link

        This latest release can be downloaded below this message

        ### ❓ How to install ExtensiveAPI on my Minecraft Server ? 

        Simply drag & drop the extensiveapi-minecraft jar file into the `/plugins/` directory of your server.
        Extensiveapi-databases and Extensiveapi-core is already shaded in Extensiveapi-minecraft, only developpers must use.

        If you need any help installing you can contact me.

        ## 📝 Change log

        This part is currently not working

        ## 📦  Maven dependency reference

        If you want to develop with ExtensiveAPI ?

        ```XML
        <repositories>\n
            <repository>\n
              <id>jitpack.io</id>\n
              <url>https://jitpack.io</url>\n
            </repository>\n
        </repositories>\n\n
        <dependencies>\n
	          <dependency>\n
	            <groupId>com.github.vSKAH</groupId>\n
	            <artifactId>ExtensiveAPI</artifactId>\n
	            <version>RC-${{ steps.latest.outputs.sha_short }}</version>\n
	          </dependency>\n
        </dependencies>
        ```\n"
    

